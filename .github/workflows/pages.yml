name: Pages

# The download page, site/, on GitHub Pages:
# https://ivancvetanovic.github.io/Penumbra-and-the-Castle-of-Shadows-Enhanced/
#
# The page is one self-contained HTML file and its screenshots; nothing is
# built. Its download buttons point at the latest release's assets
# (releases/latest/download/<file>), so a new release needs no new deployment
# of the page. A release holds Penumbra-Windows.zip and Penumbra-Android.apk,
# made on the development machine, and Penumbra-Linux.tar.gz,
# Penumbra-macOS.zip and Penumbra-iOS.ipa, which release.yml builds and adds.
#
# Runs when site/ or this file changes on main, and by hand (Actions -> Pages
# -> Run workflow). Needs the repository's Pages source set to "GitHub
# Actions" (Settings -> Pages -> Build and deployment -> Source); until then
# configure-pages fails with "Get Pages site failed".
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one that
# is half-way through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Only site/: the page needs neither the engine submodule nor the
      # original game's files.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
