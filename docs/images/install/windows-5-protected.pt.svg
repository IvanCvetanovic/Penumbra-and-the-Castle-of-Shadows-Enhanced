<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 300 140" width="600" height="280" role="img" aria-labelledby="t d" xml:lang="pt-BR" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
<title id="t">A janela azul “O Windows protegeu o computador”: Mais informações, depois Executar assim mesmo</title>
<desc id="d">A janela azul do Windows que diz O Windows protegeu o computador. Passo 1: clique em Mais informações. Passo 2: clique no botão Executar assim mesmo que aparece.</desc>
<rect x="0.5" y="0.5" width="299" height="139" rx="15.5" fill="#0b5cad" stroke="#8cc0f0" stroke-opacity="0.6"/>
<text x="16" y="32" font-size="13.4" font-weight="700" fill="#ffffff">O Windows protegeu o computador</text>
<rect x="16" y="44" width="236" height="6" rx="3" fill="#ffffff" opacity="0.45"/>
<rect x="16" y="56" width="190" height="6" rx="3" fill="#ffffff" opacity="0.45"/>
<circle cx="27" cy="85" r="11" fill="#ffc247"/>
<text x="27" y="90" font-size="14" font-weight="800" fill="#241000" text-anchor="middle">1</text>
<text x="44" y="90" font-size="15" font-weight="600" fill="#ffffff" text-decoration="underline">Mais informações</text>
<circle cx="104" cy="116" r="11" fill="#ffc247"/>
<text x="104" y="121" font-size="14" font-weight="800" fill="#241000" text-anchor="middle">2</text>
<rect x="121" y="102" width="167" height="28" rx="4" fill="#0b5cad" stroke="#ffffff" stroke-width="2"/>
<text x="204.5" y="121" font-size="11.7" font-weight="600" fill="#ffffff" text-anchor="middle">Executar assim mesmo</text>
</svg>
